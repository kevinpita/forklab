name: xrplevm
binary_name: exrpd
chain_id: xrplevm_1440000-1
bech32_prefix: ethm
key_algo: eth_secp256k1
bond_denom: apoa          # fork mode reads it from staking params; used for fresh
fee_denom: axrp
gas_prices: 800000000000axrp
block_time: 1s
export_args: ["--chain-id", "{chain_id}"]
extra_ports:              # config keys offset by i*100 per node
  app.toml:
    json-rpc.address: 8545
    json-rpc.ws-address: 8546
    json-rpc.metrics-address: 6065
    evm.geth-metrics-address: 8100
gov: { voting_period: 30s, expedited_voting_period: 20s }
upgrade_name: "v{version}"
binaries:
  "11.1.1": { url: "https://github.com/xrplevm/node/releases/download/v{version}/node_{version}_{Os}_{arch}.tar.gz" }
  "11.2.0": { url: "https://github.com/xrplevm/node/releases/download/v{version}/node_{version}_{Os}_{arch}.tar.gz" }
snapshots:
  polkachu: "https://polkachu.com/tendermint_snapshots/xrp"
patches_file: builtin:xrplevm.yaml
