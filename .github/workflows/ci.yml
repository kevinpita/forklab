name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@v0.12.0
          make fmt-check
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - name: test
        run: make test-race
      - name: build
        run: |
          make build
          ./bin/forklab version
